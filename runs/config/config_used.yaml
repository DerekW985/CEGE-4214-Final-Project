# 4. Filtering Rules
filters:
  keep_route_types: [3]               # GTFS route_type: 3 = Bus
  ignore_route_ids: ["901", "902"]    # Exclude LRT Lines 901/902
  ignore_agency_ids: ["MT_1", "MT_2", "MT_4", "MT_5", "MT_6", "MT_10", "MT_11", "MVTA_0"]

# 5. Vehicle Types Defined for Model (Set V)
vehicle_types:
  - "30ft_diesel"
  - "40ft_diesel"
  - "40ft_brt"
  - "60ft_artic"
  - "60ft_brt_artic"
  - "40ft_electric"
  - "60ft_electric"
  - "60ft_brt_electric"
  - "coach"
  - "cutaway"

# 6. Fleet Settings & Vehicles.txt Classification Rules
fleet_settings:
  use_gtfs_fleet_counts: false

  classification_keywords:
    "60ft_brt_electric":
      fuel_keywords: ["electric"]
      desc_keywords: ["articebrtlfbus", "ebrt"]
    "60ft_electric":
      fuel_keywords: ["electric"]
      desc_keywords: ["artic", "60ft"]
    "40ft_electric":
      fuel_keywords: ["electric"]
      desc_keywords: ["40lfebus", "lfe"]
    "coach":
      fuel_keywords: []
      desc_keywords: ["subhfbus", "40hfbus", "suburban", "coach"]
      require_high_floor: true
    "60ft_brt_artic":
      fuel_keywords: ["biodiesel", "diesel"]
      desc_keywords: ["articbrtlfbus", "articbrt"]
    "40ft_brt":
      fuel_keywords: ["biodiesel", "diesel"]
      desc_keywords: ["40brtlfbus", "40brt"]
    "60ft_artic":
      fuel_keywords: ["biodiesel", "diesel"]
      desc_keywords: ["artic", "60ft"]
    "40ft_diesel":
      fuel_keywords: ["biodiesel", "diesel"]
      desc_keywords: ["40lf"]
    "30ft_diesel":
      fuel_keywords: ["biodiesel", "diesel"]
      desc_keywords: ["30lf"]
    "cutaway":
      fuel_keywords: ["biodiesel", "diesel"]
      desc_keywords: ["cutaway"]

  label_prefix_agency_reassignment:
    "SW-": "MT_6"
    "PL-": "MT_5"
    "FS-": "MT_2"

  reassign_agency_buses: []
  additive_fleet_overrides:

  manual_agency_fleet_counts:
    "MT_0":
      "40ft_diesel": 602
      "40ft_brt": 50
      "60ft_artic": 99
      "60ft_brt_artic": 400
      "coach": 25
      "40ft_electric": 20
      "60ft_electric": 0
      "60ft_brt_electric": 13
    "MVTA_0":
      "40ft_diesel": 85
      "coach": 25

