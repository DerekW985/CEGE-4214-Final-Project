# Configuration for Multi-Feed & Multi-Agency GTFS Parsing

# 1. GTFS Feed Sources
gtfs_feeds:
  - feed_prefix: "MT"
    path: "MTgtfs10-8-2026.zip"
  - feed_prefix: "MVTA"
    path: "MVTA_11-8-2026.zip"

# 2. Regional Agency Mapping & Allowed Garages
agencies:
  "MT_0":
    name: "Metro Transit"
    allowed_garages: ["Heywood", "Fred_T_Heywood", "East_Metro", "South_Garage"]
  "MT_1":
    name: "Metro Transit/Met Council"
    allowed_garages: ["Heywood", "Fred_T_Heywood", "East_Metro", "South_Garage"]
  "MT_2":
    name: "Met Council"
    allowed_garages: ["Heywood", "East_Metro"]
  "MT_4":
    name: "Maple Grove"
    allowed_garages: ["Maple_Grove_Transit_Station"]
  "MT_5":
    name: "Plymouth"
    allowed_garages: ["Plymouth_Maintenance_Facility"]
  "MT_6":
    name: "SouthWest Transit"
    allowed_garages: ["SouthWest_Garage"]
  "MT_10":
    name: "Airport (MAC)"
    allowed_garages: ["MAC_Garage"]
  "MT_11":
    name: "University of Minnesota"
    allowed_garages: ["UofM_Transit_Facility"]
  "MVTA_0":
    name: "MVTA"
    allowed_garages: ["Eagan_Garage", "Burnsville_Garage"]

# 3. Filtering Rules
filters:
  keep_route_types: [3]               # GTFS route_type: 3 = Bus
  ignore_route_ids: ["901", "902"]    # Exclude LRT Lines 901/902
  ignore_agency_ids: ["MT_10"]

# 4. Vehicle Types Defined for Model (Set V)
vehicle_types:
  - "40ft_diesel"
  - "60ft_artic"
  - "40ft_electric"
  - "60ft_electric"
  - "coach"                           # High-floor suburban / express coach buses

# 5. Fleet Settings & Vehicles.txt Classification Rules
fleet_settings:
  use_gtfs_fleet_counts: true        # Parse counts from vehicles.txt in GTFS feeds

  # Classification rules for vehicles.txt records (fuel, vehicle_description, low_floor)
  classification_keywords:
    "60ft_electric":
      fuel_keywords: ["electric"]
      desc_keywords: ["artic", "60ft", "ebrt"]
    "40ft_electric":
      fuel_keywords: ["electric"]
      desc_keywords: ["40lfebus", "lfe"]
    "coach":
      fuel_keywords: []
      desc_keywords: ["subhfbus", "40hfbus", "suburban", "coach"]
      require_high_floor: true        # Triggers if low_floor == False
    "60ft_artic":
      fuel_keywords: ["biodiesel", "diesel"]
      desc_keywords: ["artic", "60ft"]
    "40ft_diesel":
      fuel_keywords: ["biodiesel", "diesel"]
      desc_keywords: ["40lf", "40brt"]

  # Reassign buses in vehicles.txt to opt-out agencies based on vehicle_label prefix
  label_prefix_agency_reassignment:
    "SW-": "MT_6"                     # SouthWest Transit
    "PL-": "MT_5"                     # Plymouth Transit
    "FS-": "MT_4"                     # Maple Grove / First Transit Contracted

  # Specific Quantity Reassignment (Move N buses of vehicle_type from agency A to B)
  reassign_agency_buses:
    - from_agency: "MT_0"
      to_agency: "MT_6"
      vehicle_type: "coach"
      count: 10
    - from_agency: "MT_0"
      to_agency: "MT_4"
      vehicle_type: "coach"
      count: 5

  # Additive Fleet Overrides (+N extra buses added to agency fleet)
  additive_fleet_overrides:
    "MT_0":
      "40ft_electric": 5              # Add 5 extra 40ft electric buses
    "MVTA_0":
      "coach": 12                     # Add 12 extra coach buses

  # Fallback manual counts if vehicles.txt is absent
  manual_agency_fleet_counts:
    "MT_0":
      "40ft_diesel": 350
      "60ft_artic": 120
      "coach": 40
      "40ft_electric": 20
      "60ft_electric": 10
    "MVTA_0":
      "40ft_diesel": 85
      "coach": 25

# 6. Route-to-Vehicle Compatibility Rules
default_vehicle_compatibility: ["40ft_diesel", "40ft_electric", "coach"]

route_vehicle_overrides:
  "5": ["60ft_artic", "60ft_electric"]
  "C_LINE": ["60ft_artic", "60ft_electric"]
  "D_LINE": ["60ft_artic", "60ft_electric"]

ev_max_block_miles: 150.0