# Configuration for Multi-Feed & Multi-Agency GTFS Parsing

# 1. GTFS Feed Sources
gtfs_feeds:
  - feed_prefix: "MT"
    path: "MTgtfs10-8-2026.zip"
  - feed_prefix: "MVTA"
    path: "MVTA_11-8-2026.zip"

# 2. Regional Agency Mapping
agencies:
  "MT_0":
    name: "Metro Transit"
  "MT_1":
    name: "Metro Transit/Met Council"
  "MT_2":
    name: "Met Council (First Transit Contracted)"
  "MT_4":
    name: "Maple Grove"
  "MT_5":
    name: "Plymouth"
  "MT_6":
    name: "SouthWest Transit"
  "MT_10":
    name: "Airport (MAC)"
  "MT_11":
    name: "University of Minnesota"
  "MVTA_0":
    name: "MVTA"

# 3. Garage Configuration
garages:
  "Nicollet":
    lat: 44.9015
    lon: -93.2778
    ev_chargers: 10
    storage_capacity: 150
    maintenance_capacity: 20
    compatible_vehicle_types: ["40ft_diesel", "40ft_brt", "40ft_electric"]
    operating_agencies: ["MT_0", "MT_1"]

  "Heywood":
    lat: 44.9781
    lon: -93.2878
    ev_chargers: 15
    storage_capacity: 210
    maintenance_capacity: 30
    compatible_vehicle_types: ["40ft_diesel", "40ft_brt", "60ft_artic", "60ft_brt_artic", "40ft_electric", "60ft_electric", "60ft_brt_electric"]
    operating_agencies: ["MT_0", "MT_1", "MT_2"]

  "Fred_T_Heywood":
    lat: 44.9785
    lon: -93.2885
    ev_chargers: 20
    storage_capacity: 175
    maintenance_capacity: 25
    compatible_vehicle_types: ["40ft_diesel", "40ft_brt", "60ft_artic", "60ft_brt_artic", "40ft_electric", "60ft_electric", "60ft_brt_electric"]
    operating_agencies: ["MT_0", "MT_1"]

  "East_Metro":
    lat: 44.9535
    lon: -93.0762
    ev_chargers: 10
    storage_capacity: 160
    maintenance_capacity: 20
    compatible_vehicle_types: ["40ft_diesel", "40ft_brt", "60ft_artic", "60ft_brt_artic", "40ft_electric", "60ft_electric", "60ft_brt_electric"]
    operating_agencies: ["MT_0", "MT_1", "MT_2"]

  "South_Garage":
    lat: 44.8710
    lon: -93.2890
    ev_chargers: 12
    storage_capacity: 190
    maintenance_capacity: 25
    compatible_vehicle_types: ["40ft_diesel", "40ft_brt", "60ft_artic", "60ft_brt_artic", "40ft_electric", "60ft_electric", "60ft_brt_electric"]
    operating_agencies: ["MT_0", "MT_1"]

  "Eagan_Garage":
    lat: 44.8150
    lon: -93.1700
    ev_chargers: 8
    storage_capacity: 120
    maintenance_capacity: 15
    compatible_vehicle_types: ["40ft_diesel", "40ft_brt", "60ft_artic", "60ft_brt_artic", "40ft_electric", "coach"]
    operating_agencies: ["MVTA_0"]

  "SouthWest_Garage":
    lat: 44.8620
    lon: -93.4750
    ev_chargers: 5
    storage_capacity: 75
    maintenance_capacity: 10
    compatible_vehicle_types: ["40ft_diesel", "60ft_artic", "coach"]
    operating_agencies: ["MT_6"]

# 4. Filtering Rules
filters:
  keep_route_types: [3]               # GTFS route_type: 3 = Bus
  ignore_route_ids: ["901", "902"]    # Exclude LRT Lines 901/902
  ignore_agency_ids: ["MT_10"]

# 5. Vehicle Types Defined for Model (Set V)
vehicle_types:
  - "40ft_diesel"
  - "40ft_brt"
  - "60ft_artic"
  - "60ft_brt_artic"
  - "40ft_electric"
  - "60ft_electric"
  - "60ft_brt_electric"
  - "coach"

# 6. Fleet Settings & Vehicles.txt Classification Rules
fleet_settings:
  use_gtfs_fleet_counts: true

  classification_keywords:
    "60ft_brt_electric":
      fuel_keywords: ["electric"]
      desc_keywords: ["articebrtlfbus", "ebrt"]
    "60ft_electric":
      fuel_keywords: ["electric"]
      desc_keywords: ["artic", "60ft"]
    "40ft_electric":
      fuel_keywords: ["electric"]
      desc_keywords: ["40lfebus", "lfe"]
    "coach":
      fuel_keywords: []
      desc_keywords: ["subhfbus", "40hfbus", "suburban", "coach"]
      require_high_floor: true
    "60ft_brt_artic":
      fuel_keywords: ["biodiesel", "diesel"]
      desc_keywords: ["articbrtlfbus", "articbrt"]
    "40ft_brt":
      fuel_keywords: ["biodiesel", "diesel"]
      desc_keywords: ["40brtlfbus", "40brt"]
    "60ft_artic":
      fuel_keywords: ["biodiesel", "diesel"]
      desc_keywords: ["artic", "60ft"]
    "40ft_diesel":
      fuel_keywords: ["biodiesel", "diesel"]
      desc_keywords: ["40lf"]

  label_prefix_agency_reassignment:
    "SW-": "MT_6"
    "PL-": "MT_5"
    "FS-": "MT_2"

  reassign_agency_buses: []
  additive_fleet_overrides: {}

  manual_agency_fleet_counts:
    "MT_0":
      "40ft_diesel": 300
      "40ft_brt": 40
      "60ft_artic": 100
      "60ft_brt_artic": 50
      "coach": 40
      "40ft_electric": 20
      "60ft_electric": 10
      "60ft_brt_electric": 10
    "MVTA_0":
      "40ft_diesel": 85
      "coach": 25

# 7. Route-to-Vehicle Compatibility Rules (BRT Routes require BRT Fleet)
default_vehicle_compatibility: ["40ft_diesel", "40ft_electric", "coach"]

route_vehicle_overrides:
  "5": ["60ft_brt_artic", "60ft_brt_electric"]
  "C_LINE": ["60ft_brt_artic", "60ft_brt_electric"]
  "D_LINE": ["60ft_brt_artic", "60ft_brt_electric"]
  "A_LINE": ["40ft_brt", "60ft_brt_artic"]

ev_max_block_miles: 150.0