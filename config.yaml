# 4. Filtering Rules
filters:
  keep_route_types: [3]               # GTFS route_type: 3 = Bus
  ignore_route_ids: ["901", "902"]    # Exclude LRT Lines 901/902
  ignore_agency_ids: ["MT_10", "MT_11"]

# 5. Vehicle Types Defined for Model (Set V)
vehicle_types:
  - "40ft_diesel"
  - "40ft_brt"
  - "60ft_artic"
  - "60ft_brt_artic"
  - "40ft_electric"
  - "60ft_electric"
  - "60ft_brt_electric"
  - "coach"

# 6. Fleet Settings & Vehicles.txt Classification Rules
fleet_settings:
  use_gtfs_fleet_counts: true

  classification_keywords:
    "60ft_brt_electric":
      fuel_keywords: ["electric"]
      desc_keywords: ["articebrtlfbus", "ebrt"]
    "60ft_electric":
      fuel_keywords: ["electric"]
      desc_keywords: ["artic", "60ft"]
    "40ft_electric":
      fuel_keywords: ["electric"]
      desc_keywords: ["40lfebus", "lfe"]
    "coach":
      fuel_keywords: []
      desc_keywords: ["subhfbus", "40hfbus", "suburban", "coach"]
      require_high_floor: true
    "60ft_brt_artic":
      fuel_keywords: ["biodiesel", "diesel"]
      desc_keywords: ["articbrtlfbus", "articbrt"]
    "40ft_brt":
      fuel_keywords: ["biodiesel", "diesel"]
      desc_keywords: ["40brtlfbus", "40brt"]
    "60ft_artic":
      fuel_keywords: ["biodiesel", "diesel"]
      desc_keywords: ["artic", "60ft"]
    "40ft_diesel":
      fuel_keywords: ["biodiesel", "diesel"]
      desc_keywords: ["40lf"]

  label_prefix_agency_reassignment:
    "SW-": "MT_6"
    "PL-": "MT_5"
    "FS-": "MT_2"

  reassign_agency_buses: []
  additive_fleet_overrides: {}

  manual_agency_fleet_counts:
    "MT_0":
      "40ft_diesel": 300
      "40ft_brt": 40
      "60ft_artic": 100
      "60ft_brt_artic": 50
      "coach": 40
      "40ft_electric": 20
      "60ft_electric": 10
      "60ft_brt_electric": 10
    "MVTA_0":
      "40ft_diesel": 85
      "coach": 25

# 7. Route-to-Vehicle Compatibility Rules (BRT Routes require BRT Fleet)
default_vehicle_compatibility: ["40ft_diesel", "40ft_electric", "coach"]

route_vehicle_overrides:
  "5": ["60ft_brt_artic", "60ft_brt_electric"]
  "C_LINE": ["60ft_brt_artic", "60ft_brt_electric"]
  "D_LINE": ["60ft_brt_artic", "60ft_brt_electric"]
  "A_LINE": ["40ft_brt", "60ft_brt_artic"]

ev_max_block_miles: 150.0
