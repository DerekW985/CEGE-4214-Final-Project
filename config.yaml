# Configuration for Multi-Feed & Multi-Agency GTFS Parsing

# 1. GTFS Feed Sources
gtfs_feeds:
  - feed_prefix: "MT"
    path: "MTgtfs10-8-2026.zip"
  - feed_prefix: "MVTA"
    path: "MVTA_11-8-2026.zip"

# 2. Regional Agency Mapping
agencies:
  "MT_0":
    name: "Metro Transit"
  "MT_1":
    name: "Metro Transit/Met Council"
  "MT_2":
    name: "Met Council (First Transit Contracted)"
  "MT_4":
    name: "Maple Grove"
  "MT_5":
    name: "Plymouth"
  "MT_6":
    name: "SouthWest Transit"
  "MT_10":
    name: "Airport (MAC)"
  "MT_11":
    name: "University of Minnesota"
  "MVTA_0":
    name: "MVTA"

# 3. Garage Configuration
garages:
